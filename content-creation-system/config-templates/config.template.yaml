# Generated by setup wizard — edit anytime

system:
  version: 1.0.0
  initialized: "{{TIMESTAMP}}"

platforms:
  active: {{PLATFORMS}}  # [tiktok, instagram, youtube]
  tiktok:
    enabled: {{TIKTOK_ENABLED}}
    posting_frequency: "{{TIKTOK_FREQ}}"  # e.g., "3x/week"
  instagram:
    enabled: {{IG_ENABLED}}
    posting_frequency: "{{IG_FREQ}}"
  youtube:
    enabled: {{YT_ENABLED}}
    posting_frequency: "{{YT_FREQ}}"

production:
  equipment: {{EQUIPMENT}}   # e.g., ["iPhone 14 Pro", "Rode mic", "ring light"]
  locations: {{LOCATIONS}}   # e.g., ["home studio", "co-working space"]
  effort_threshold: "{{EFFORT}}"  # low/medium/high

validation:
  novelty_min: {{NOVELTY_MIN}}   # e.g., 0.5 (reject if too similar to past content)
  trend_sensitivity: {{TREND_SENS}}  # e.g., 0.7 (how much to weight trends)

memory:
  vector_db: "{{VECTOR_DB}}"   # pinecone/weaviate/local
  refresh_cycle: "{{REFRESH}}"  # daily/weekly

api_keys:
  ensemble_data: "${ENSEMBLE_KEY}"
  analytics: "${ANALYTICS_KEY}"
