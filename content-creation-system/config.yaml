# Content Creation System — Shared Config

user:
  name: Mondo
  brand_pillars:
    - neurotechnology
    - AI_product
    - personal_journey
  platforms:
    - tiktok
    - instagram
    - youtube

content_velocity:
  weekly_target: 3
  effort_threshold: medium

api_keys:
  ensemble_data: ${ENSEMBLE_KEY}
  analytics: ${ANALYTICS_KEY}

memory:
  vector_db: pinecone
  refresh_cycle: weekly

paths:
  knowledge_base: knowledge-base/
  scripts: scripts/
  sub_agents: sub-agents/

sub_agents:
  enabled:
    - content-idea-validator   # validator
    - content-planner          # planner
    - trend-intelligence       # trends
    - persona-voice            # persona
    - performance-analyst      # analyst
    - distribution-timing     # distributor
    - research-factcheck       # research

output:
  format: markdown
  include_metadata: true
