# Metrics Configuration
# Definitions and thresholds for performance analysis

metrics:
  engagement:
    - engagement_rate
    - likes
    - comments
    - shares
  reach:
    - impressions
    - reach
  conversion:
    - clicks
    - conversions
  retention:
    - watch_time
    - completion_rate

thresholds:
  high_performer: 1.5  # multiplier vs baseline
  low_performer: 0.5
